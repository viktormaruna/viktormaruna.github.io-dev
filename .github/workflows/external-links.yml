name: External link check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      HUGO_DEB_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          echo "${HUGO_DEB_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with Hugo
        run: hugo --gc --minify
      - name: Check external links
        run: |
          HTMLTEST_VERSION=0.17.0
          HTMLTEST_SHA256=775c597ee74899d6002cd2d93076f897f4ba68686bceabe2e5d72e84c57bc0fb
          curl -sLo /tmp/htmltest.tar.gz \
            "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HTMLTEST_SHA256}  /tmp/htmltest.tar.gz" | sha256sum -c -
          tar -xf /tmp/htmltest.tar.gz -C /tmp
          chmod +x /tmp/htmltest
          /tmp/htmltest --conf .htmltest.external.yml
