# Workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Validates the build on pull requests without deploying
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Least-privilege default; the deploy job elevates to what Pages needs
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    # GitHub-hosted runners automatically enable `set -eo pipefail` for Bash shells.
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      # From hugo_${HUGO_VERSION}_checksums.txt on the release page
      HUGO_DEB_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
      HUGO_ENVIRONMENT: production
      TZ: Europe/Bratislava
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          echo "${HUGO_DEB_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum -c -
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # full history for .GitInfo / enableGitInfo
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Cache Restore
        id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ hashFiles('hugo.toml', 'content/**', 'layouts/**', 'themes/**', 'static/**') }}
          restore-keys:
            hugo-
      - name: Build with Hugo
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          hugo \
            --gc \
            --minify \
            --printPathWarnings \
            ${BASE_URL:+--baseURL "${BASE_URL}/"} \
            --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache Save
        id: cache-save
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Validate generated outputs
        run: |
          python3 - <<'EOF'
          import json, re, sys
          import xml.dom.minidom as md
          md.parse('public/feed.xml')
          md.parse('public/sitemap.xml')
          json.load(open('public/index.json'))
          html = open('public/index.html').read()
          for m in re.findall(r'<script type=["\']?application/ld\+json["\']?>(.*?)</script>', html, re.S):
              json.loads(m)
          print('feed.xml, sitemap.xml, index.json, JSON-LD: all valid')
          EOF
      - name: Check internal links
        run: |
          HTMLTEST_VERSION=0.17.0
          HTMLTEST_SHA256=775c597ee74899d6002cd2d93076f897f4ba68686bceabe2e5d72e84c57bc0fb
          curl -sLo /tmp/htmltest.tar.gz \
            "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HTMLTEST_SHA256}  /tmp/htmltest.tar.gz" | sha256sum -c -
          tar -xf /tmp/htmltest.tar.gz -C /tmp
          chmod +x /tmp/htmltest
          /tmp/htmltest --conf .htmltest.yml
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
